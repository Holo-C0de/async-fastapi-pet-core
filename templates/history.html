<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>История действий</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-4">
        <span class="navbar-brand mb-0 h1">🕵️ История действий</span>
        <a href="/admin" class="btn btn-outline-light btn-sm">Назад в админку</a>
    </nav>

    <div class="container mt-5">
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <table class="table table-striped mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Время</th>
                            <th>Кто (Логин)</th>
                            <th>Что сделал</th>
                            <th>ID Питомца</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for log in logs %}
                        <tr>
                            <td>{{ log.created_at.strftime('%d.%m.%Y %H:%M:%S') }}</td>
                            <td><span class="badge bg-primary">{{ log.username }}</span></td>
                            <td>{{ log.action }}</td>
                            <td>#{{ log.pet_id }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
